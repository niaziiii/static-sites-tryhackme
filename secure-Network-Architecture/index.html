<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://assets.tryhackme.com/img/favicon.png"
    />
    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v5.12.0/css/all.css"
      integrity="sha384-ekOryaXPbeCpWQNxMwSWVvQ0+1VrStoPJq54shlYhR8HzQgig1v5fas6YgOqLoKz"
      crossorigin="anonymous"
    />

    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Do a quick quiz and find out your ideal cyber security career!"
    />
    <meta
      name="keywords"
      content="cyber security jobs, cyber security, security analyst, soc analyst, penetration tester, incident responder, red teamer, security engineer"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/4f572bc49d.js"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"
    />
    <title>TryHackMe | Secure Network Architecture</title>
  </head>
  <body class="body">
    <div class="wrapper flex flex-col overflow-hidden">
      <!-- Header -->
      <header class="offical-header relative">
        <div class="image-container">
          <img
            src="https://assets.tryhackme.com/img/logo/tryhackme_logo_full.svg"
            alt="image-logo"
            class="w-full h-16"
          />
        </div>
        <div class="header-content w-full text-center">
          <h1 class="font-heading heading-main text-white">
            Secure Network Architecture
          </h1>
        </div>
      </header>

      <!-- main-content -->
      <main
        class="w-full flex-1 flex flex-col h-full flex flex-col flex-1 special-section"
      >
        <div id="main-content" class="w-full flex-1 relative">
          <div
            class="w-[80%] m-auto flex items-center justify-center gap-2 email text-black bg-white mt-8 rounded overflow-hidden"
          ></div>
        </div>
      </main>
    </div>
    <script src="./index.min.js"></script>
  </body>
</html>
